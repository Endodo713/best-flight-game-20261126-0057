<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier — bush mail over the Merpati chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1b26; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #f2ead8; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }

  /* --- HUD: lit instruments, amber on dark glass --- */
  #hud { position: absolute; inset: 0; }
  .hud-corner { position: absolute; padding: 14px 18px; background: rgba(8, 20, 28, 0.55);
    border: 1px solid rgba(255, 176, 46, 0.35); border-radius: 10px;
    backdrop-filter: blur(2px); min-width: 190px; }
  .hud-tl { top: 14px; left: 14px; }
  .hud-tr { top: 14px; right: 14px; text-align: right; }
  .hud-label { font-size: 10px; letter-spacing: 2px; color: #ffb02e; opacity: 0.9; margin-top: 8px; }
  .hud-label:first-child { margin-top: 0; }
  .hud-big { font-size: 30px; font-weight: 700; line-height: 1.05; color: #fff6dd;
    text-shadow: 0 0 12px rgba(255, 176, 46, 0.55); font-variant-numeric: tabular-nums; }
  .hud-unit { font-size: 13px; font-weight: 400; color: #ffb02e; }
  .hud-small { font-size: 14px; color: #e8e0c8; font-variant-numeric: tabular-nums; }
  .hud-bar { height: 6px; background: rgba(255,255,255,0.14); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .hud-bar.wide { width: 190px; }
  .hud-fill { height: 100%; border-radius: 3px; transition: width 0.15s linear; }
  .hud-fill.speed { background: #57c465; width: 0%; }
  .hud-fill.alt { background: #4aa8e0; width: 0%; }
  .hud-fill.fuel { background: #ffb02e; width: 100%; }
  .hud-fill.fuel.low { background: #ff5340; }
  .hud-fill.thr { background: #ff7a1a; width: 35%; }
  .hud-compass { width: 190px; overflow: hidden; margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.25); height: 22px; position: relative; }
  .hud-compass::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
    background: #ffb02e; transform: translateX(-50%); }
  #hud-compass-strip { display: flex; width: 960px; height: 22px; align-items: center; }
  #hud-compass-strip span { flex: 0 0 80px; text-align: center; font-size: 12px; color: #fff6dd; }
  .hud-center { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; }
  #hud-horizon { border-radius: 50%; border: 2px solid rgba(255, 176, 46, 0.5);
    background: rgba(8, 20, 28, 0.55); box-shadow: 0 0 18px rgba(0,0,0,0.4); }
  .hud-warn { margin-top: 8px; font-weight: 800; letter-spacing: 1px; color: #ff5340;
    background: rgba(40, 5, 5, 0.7); border: 1px solid #ff5340; border-radius: 6px;
    padding: 6px 10px; font-size: 13px; animation: blink 0.5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .hidden { display: none !important; }
  .hud-objective { position: absolute; left: 14px; bottom: 14px; padding: 12px 16px;
    background: rgba(8, 20, 28, 0.55); border: 1px solid rgba(255, 176, 46, 0.35);
    border-radius: 10px; max-width: 430px; }
  .hud-mission-name { font-size: 12px; letter-spacing: 2px; color: #ffb02e; font-weight: 700; }
  .hud-objective-text { font-size: 15px; margin: 4px 0 8px; color: #fff6dd; }
  .hud-rings { display: flex; gap: 6px; margin-bottom: 6px; }
  .hud-ring { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.65); }
  .hud-ring.next { border-color: #ffb02e; color: #ffb02e; box-shadow: 0 0 10px rgba(255, 176, 46, 0.6); }
  .hud-ring.done { border-color: #57c465; color: #57c465; background: rgba(87, 196, 101, 0.2); }
  .hud-message { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: rgba(8, 20, 28, 0.8); border: 1px solid rgba(255, 176, 46, 0.5); color: #fff6dd;
    padding: 10px 18px; border-radius: 8px; font-size: 15px; opacity: 0; transition: opacity 0.3s;
    max-width: 640px; text-align: center; }
  .hud-message.show { opacity: 1; }
  .hud-toast { position: absolute; left: 50%; top: 180px; transform: translateX(-50%);
    color: #ffb02e; font-size: 22px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7); }

  /* --- Screens: title, debrief, pause --- */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: radial-gradient(ellipse at center, rgba(10, 25, 35, 0.55) 0%, rgba(5, 12, 18, 0.88) 100%);
    pointer-events: auto; z-index: 10; padding: 24px; text-align: center; }
  .screen h1 { font-size: 64px; letter-spacing: 8px; font-weight: 900; color: #fff6dd;
    text-shadow: 0 0 24px rgba(255, 176, 46, 0.65), 0 4px 0 rgba(0,0,0,0.35); }
  .tagline { font-size: 17px; color: #e8e0c8; margin: 10px 0 26px; max-width: 620px; }
  .mission-list { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px; }
  .mission-card { pointer-events: auto; cursor: pointer; width: 250px; text-align: left;
    background: rgba(13, 32, 44, 0.85); border: 1px solid rgba(255, 176, 46, 0.4); border-radius: 12px;
    padding: 16px; color: #f2ead8; font-family: inherit; transition: transform 0.12s, border-color 0.12s; }
  .mission-card:hover { transform: translateY(-3px); border-color: #ffb02e; }
  .mission-num { display: block; font-size: 11px; letter-spacing: 2px; color: #ffb02e; font-weight: 700; }
  .mission-name { display: block; font-size: 21px; font-weight: 800; margin: 4px 0; }
  .mission-brief { display: block; font-size: 13px; line-height: 1.45; color: #d8d0b8; margin-bottom: 8px; }
  .mission-meta { display: block; font-size: 12px; color: #9fb6c4; }
  .controls { font-size: 13px; color: #9fb6c4; }
  .menu-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .menu-button { pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 12px 22px; border-radius: 9px; border: 1px solid rgba(255, 176, 46, 0.55);
    background: rgba(13, 32, 44, 0.9); color: #f2ead8; }
  .menu-button:hover { border-color: #ffb02e; }
  .menu-button.primary { background: #ffb02e; color: #1a1206; border-color: #ffb02e; }
  .debrief-stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 26px; }
  .stat { background: rgba(13, 32, 44, 0.85); border: 1px solid rgba(255, 176, 46, 0.35);
    border-radius: 10px; padding: 12px 18px; min-width: 120px; }
  .stat-k { display: block; font-size: 11px; letter-spacing: 2px; color: #ffb02e; }
  .stat-v { display: block; font-size: 22px; font-weight: 800; margin-top: 4px; }

  /* --- Screenshot pose: the title menu drops to the bottom so the parked
     plane shows in the clear sky above it. Normal play is untouched. --- */
  .shot-start .screen { justify-content: flex-end; padding-bottom: 16px; }
  .shot-start .screen h1 { font-size: 46px; letter-spacing: 6px; }
  .shot-start .tagline { margin: 6px 0 14px; font-size: 15px; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="screen-title" class="screen"></div>
  <div id="screen-debrief" class="screen hidden"></div>
  <div id="screen-pause" class="screen hidden"></div>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
